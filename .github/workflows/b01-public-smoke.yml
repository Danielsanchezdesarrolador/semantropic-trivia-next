name: B02 - validar sitio oficial publicado
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Instalar Playwright
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Verificar Render LIVE en PC y móvil emulado
        env:
          ST_OFFICIAL_URL: https://semantropic-trivia-next-web.onrender.com/
        run: node scripts/b02-home-official-smoke.mjs
      - name: Guardar capturas reales de producción
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B02-Publicado-PC-Mobile
          path: artifacts/b02-official/
          if-no-files-found: ignore
