name: B02 - validar lobby oficial antes de fusionar
on:
  push:
    branches: [staging, release/b02-home-oficial, feat/b02-lobby-navegable, feat/b02-fullscreen-pc-mobile]
  pull_request:
    branches: [main, staging]
jobs:
  official-home:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Instalar paquetes npm
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run check
      - name: Pruebas unitarias
        run: npm test
      - name: Construir Vite
        run: npm run build
      - name: Guard audio/editorial/semantic y assets ART-CP01
        run: node scripts/b04/guard-option-c.mjs
      - name: Confirmar index oficial
        run: test -f dist/index.html
      - name: Instalar Playwright
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Navegar portada compilada desde PC y móvil emulado
        run: node scripts/b02-home-official-smoke.mjs
      - name: Validar ronda local, cronómetro y arco continuo
        run: node scripts/b03-c3-browser-smoke.mjs
      - name: Conservar laboratorio visual y geometría aprobada
        run: node scripts/b03-b02-browser-smoke.mjs
      - name: B04 bienvenida y acceso en escritorio y móvil emulado
        env:
          B04_EVIDENCE_DIR: artifacts/b04
        run: node scripts/b04/visual-qa.mjs
      - name: Construir base staging anterior a ART-CP01
        run: |
          git fetch --no-tags origin ac216f009c7cdd88b558c14e7625e2f347bf0eb8
          git worktree add --detach "$RUNNER_TEMP/b04-c3-baseline" ac216f009c7cdd88b558c14e7625e2f347bf0eb8
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/b04-c3-baseline/node_modules"
          cd "$RUNNER_TEMP/b04-c3-baseline"
          npm run build
      - name: Acceso y ART-CP01: navegación, canon y regresión visual protegida
        env:
          B04_C3_BASE_DIR: ${{ runner.temp }}/b04-c3-baseline/dist
        run: node scripts/b04/c3-qa.mjs
      - name: Guardar capturas de prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B02-Lobby-Oficial-PC-Mobile
          path: |
            artifacts/b02-official/
            artifacts/b03-c3/
            artifacts/b03-b02/
            artifacts/b04/
            artifacts/b04-c3/
          if-no-files-found: ignore
