name: B03-C5 - generar MP3 de lobby aprobado
on:
  workflow_dispatch:
  push:
    branches: [docs/b03-c5a-direccion-sonora]
    paths:
      - .github/workflows/b03-approved-lobby-audio.yml
      - scripts/audio/generate_approved_lobby.py

permissions:
  contents: write

jobs:
  render-approved-lobby:
    runs-on: ubuntu-latest
    container: python:3.11-slim-trixie
    timeout-minutes: 15
    steps:
      - name: Instalar git y codificador en Debian 13
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ffmpeg libsndfile1 ca-certificates
      - name: Extraer rama autorizada
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Dependencias reproducibles
        run: |
          python -m pip install --no-cache-dir numpy==2.3.5 scipy==1.17.0 soundfile==0.13.1
      - name: Crear el MP3 y verificar SHA-256 exacto
        run: |
          python scripts/audio/generate_approved_lobby.py
          test "$(sha256sum public/assets/audio/music/semantropic_lobby_pop_familiar_v001.mp3 | awk '{print $1}')" = "e82e7f4d6e129eddad15a9cf26c4118ae545646d4ae08fc33c19e45c27d37707"
      - name: Guardar audio aprobado en la rama, no en main
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/audio/music/semantropic_lobby_pop_familiar_v001.mp3
          if ! git diff --cached --quiet; then
            git commit -m "assets(audio): guardar musica lobby aprobada verificada por SHA-256"
            git push origin HEAD:docs/b03-c5a-direccion-sonora
          else
            echo "MP3 aprobado ya registrado; no se requiere commit"
          fi
